manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
    - name: t3dodson
      url-base: https://github.com/t3dodson
    - name: M165437
      url-base: https://github.com/M165437
    # Local override while developing the dynamic NKRO feature (see ~/code/zmk and
    # ~/code/nice-view-gem, both on branch "dynamic-nkro"). Once pushed to the t3dodson
    # forks this should switch back to the zmkfirmware/t3dodson remotes above and real
    # commit hashes.
    - name: local
      url-base: file:///home/tom/code
  projects:
    - name: zmk
      # TEMP local dev override for the dynamic-nkro feature (~/code/zmk @ dynamic-nkro,
      # rebased onto upstream 64daf698). Restore to the pinned remote SHA below once verified:
      #   remote: zmkfirmware
      #   revision: 64daf698e073e37b6748ac54f4eb48d8666af0b9
      remote: local
      revision: dynamic-nkro
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: bc114546392b4615ac90a99140eaf21dde31209d
    - name: nice-view-gem
      # TEMP local dev override (~/code/nice-view-gem @ main = spi0 fix + N/6 nkro indicator).
      # Restore to the pinned remote SHA below once verified + pushed:
      #   remote: t3dodson
      #   revision: 41e89785d344f4de52cf023cd1c250d4d19da772
      remote: local
      revision: main
  self:
    path: config
