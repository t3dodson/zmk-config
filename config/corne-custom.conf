# https://zmk.dev/docs/config/system
# Custom profile configuration

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_DEVICE_NAME="corne-custom"
CONFIG_USB_DEVICE_MANUFACTURER="Tom Dodson"
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
# Dynamic NKRO: compile in both HKRO + NKRO, switch at runtime via &dyn_nkro
# (persisted to flash, applied on reboot). The report-type choice below sets the
# first-boot default; NKRO here means NKRO until toggled.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_REPORT_TYPE_DYNAMIC=y
# USB boot-protocol support: when a host (BIOS/UEFI/KVM) selects HID boot protocol,
# ZMK sends a standard 6KRO boot report regardless of the active NKRO/HKRO mode, so
# boot devices work even with NKRO as the default.
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_KEYBOARD_NAME="corne-custom"
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_INVERTED=n
